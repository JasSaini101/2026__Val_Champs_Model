[project]
name = "valchamps"
version = "0.1.0"
description = "Map-level match model and Monte Carlo bracket simulator for VALORANT Champions 2026"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lxml>=5.2",
    "pandas>=2.2",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# Later phases (modelling, serving, dashboard) add their own extras here.
mlops = ["dvc>=3.50"]

[project.scripts]
valchamps = "valchamps.cli:app"

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/valchamps"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# HTML templates mirroring vlr.gg markup (long lines, en dashes are part of the markup).
"tests/fixtures/generate_synthetic.py" = ["E501", "RUF001"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
